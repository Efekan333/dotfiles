# Font: Courier Prime Code (dotted 0) for text; Code has no bold, so bold comes from
# Courier Prime SemiBold instead of kitty smearing regular glyphs ("fake bold").
font_family      family="Courier Prime Code"
italic_font      family="Courier Prime Code" style="Italic"
bold_font        family="Courier Prime" style="SemiBold"
bold_italic_font family="Courier Prime" style="Bold Italic"
font_size 12.0
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0
