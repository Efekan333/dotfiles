# Monochrome theme — values from ~/dotfiles/palette.md. Hue meaning is replaced by brightness:
# errors (red) loudest, success/info (green/blue/…) quiet. Bold/reverse carry the rest.
foreground #d6d6d6
background #0c0c0c

# Highlight = inversion
selection_foreground #0c0c0c
selection_background #f0f0f0
cursor               #d6d6d6
cursor_text_color    #0c0c0c
url_color            #f0f0f0

# black (0 = surface, 8 = dim: zsh-autosuggest/comments use 8 → must stay readable)
color0  #161616
color8  #808080
# red: errors → brightest
color1  #f0f0f0
color9  #f0f0f0
# green: success → quiet
color2  #a8a8a8
color10 #d6d6d6
# yellow: warnings
color3  #d6d6d6
color11 #f0f0f0
# blue (ls dirs, also bold)
color4  #a8a8a8
color12 #d6d6d6
# magenta
color5  #a8a8a8
color13 #d6d6d6
# cyan
color6  #a8a8a8
color14 #d6d6d6
# white
color7  #d6d6d6
color15 #f0f0f0
