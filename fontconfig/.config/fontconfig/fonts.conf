<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Courier Prime Code + Courier Prime Medium/SemiBold ship without isFixedPitch/PANOSE mono,
     so fontconfig doesn't mark them spacing=100 and kitty (mono-only) falls back to Noto.
     target="scan" patches the pattern at cache-build time; run `fc-cache -f` after edits. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Courier Prime Code</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Courier Prime</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>

  <!-- Rice Mono = THE rice text font. Every config asks for "Rice Mono"; switch fonts here only,
       then `fc-cache -f` + restart apps. Check: `fc-match "Rice Mono"` (a missing target falls back silently).
       kitty is NOT aliased (needs Code variant + separate SemiBold bold) → edit kitty.conf too. -->
  <alias binding="same">
    <family>Rice Mono</family>
    <prefer><family>Courier Prime</family></prefer>
  </alias>
</fontconfig>
